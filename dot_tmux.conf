# Tell tmux to propagate the copy to the system clipboard
set -g set-clipboard on

# Enable OSC52 clipboard sequences to pass through tmux (added in tmux 3.3, not available in 3.0a)
if-shell '[ "$(tmux -V | sed "s/[^0-9.]//g" | awk -F. "{printf \"%d%02d\", \$1, \$2}")" -ge 303 ]' \
    'set -g allow-passthrough on'

# NOTE: For tmux 3.0a (remote) I have to use terminal overrides
# Use tmux-256color for proper color and italic support inside tmux
set -g default-terminal "tmux-256color"

# Pass through italic and true color escape sequences to the outer terminal
set -as terminal-overrides ',*:sitm=\E[3m'
set -as terminal-overrides ',*:Tc'

# OSC 52 clipboard passthrough - both patterns set; only the one matching $TERM of the outer terminal applies
set -as terminal-overrides ',xterm-256color:Ms=\E]52;c;%p2%s\7'
set -as terminal-overrides ',alacritty:Ms=\E]52;c;%p2%s\7'
set -as terminal-overrides ',alacritty-256color:Ms=\E]52;c;%p2%s\7'

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style splits
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Automatically renumber-windows
set -g renumber-windows on

# visuals
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=default'
set -g window-status-style "bg=default"
set -g status-bg default
set -g window-status-current-style "bg=default"
set -g status-left '#[fg=#1F1F28,bg=#957FB8,bold] #S #[default]'
set -g status-left-length 20
set -g status-right ''

if-shell '[ "$(tmux -V | sed "s/[^0-9.]//g" | awk -F. "{printf \"%d%02d\", \$1, \$2}")" -ge 302 ]' \
    'set -g pane-border-lines single'
set -g pane-border-style 'fg=#54546D'
set -g pane-active-border-style 'fg=#957FB8'
setw -g window-status-separator ''
setw -g window-status-current-format '  #I #W #F  '
setw -g window-status-format '  #I #W #F  '
setw -g window-status-current-style 'bg=#C8C093 fg=#1F1F28  bold'
setw -g window-status-style 'bg=default fg=#C8C093'

setw -g mode-keys vi

# Vi copy-mode bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Window swapping
bind-key -r Left swap-window -t -1 \; select-window -t -1
bind-key -r Right swap-window -t +1 \; select-window -t +1

# Fix ESC delay for Neovim
set -sg escape-time 0

# Enable focus events (help Neovim know when you switch panes)
set -g focus-events on

# --- Pane Management ---
# Balance panes horizontally
bind-key = select-layout even-horizontal

# Balance panes vertically
bind-key + select-layout even-vertical

# Tiled layout
bind-key | select-layout tiled

# --- Session/Pane killing ---
# Kill session
bind U confirm-before -p "Kill session #S? (y/n)" kill-session

# Kill current pane
bind u confirm-before -p "Kill this pane? (y/n)" kill-pane

