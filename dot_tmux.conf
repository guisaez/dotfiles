
# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# don't rename windows automatically
set-option -g allow-rename off

# DESIGN TWEAKS
# I am using the terminal default's colors (by using the named colors,
# like `red`, `yellow`, `black`. This allows tmux to play nicely with whatever
# color theme you have set for your terminal.

# don't do anything when the a 'bell' rings
set -g visual-activity on
set -g visual-bell on
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g mode-style 'fg=black bg=red bold'

# panes
set -g pane-border-style 'fg=red'
set -g pane-active-border-style 'fg=yellow'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=red'

set -g status-left ''
set -g status-left-length 10

set -g status-right-style 'fg=black bg=yellow'
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50

setw -g window-status-current-style 'fg=black bg=red'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=red bg=black'
setw -g window-status-format ' #I #[fg=white]#W #[fg=yellow]#F '

setw -g window-status-bell-style 'fg=yellow bg=red bold'

# messages
set -g message-style 'fg=yellow bg=red bold'

# split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"


# reload config file
bind r source-file ~/.tmux.conf

# shorten command delay
set -sg escape-time 1

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# enable vi mode keys
set-window-option -g mode-keys vi

# enable extended key sequences for terminals that support it(e.g ghossty)
# (extended-keys/terminal-features need tmux >= 3.2; older remotes skip this)
%if #{>=:#{version},3.2}
set -g extended-keys on

# tell tmux the outer terminal supports extended keys even when its terminfo
# entry isn't installed on a remote host (e.g. ssh'ing without xterm-ghostty
# terminfo present there, where TERM falls back to xterm-256color)
set -as terminal-features ",xterm-ghostty:extkeys,xterm-256color:extkeys"
%endif

# set default terminal mode to 256 colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:RGB,xterm-256color:RGB"

# allow focus events to get through applications running in tmux
set -g focus-events on

# # --- Session/Pane killing ---
# Kill session
bind U confirm-before -p "Kill session #S? (y/n)" kill-session

# Kill current pane
bind u confirm-before -p "Kill this pane? (y/n)" kill-pane

# Tell tmux to propagate the copy to the system clipboard
set -g set-clipboard on

